name: Build Linux release

# Manually builds the static Linux x86_64 (musl) release archive for a commit.
# The maintainer verifies the uploaded artifact and attaches it to the GitHub
# release; this workflow publishes nothing.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to build
        required: true
        default: main

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1
  TARGET: x86_64-unknown-linux-musl

jobs:
  linux-musl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ env.TARGET }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false

      - name: Build
        env:
          HERDR_BUILD_CHANNEL: stable
          # rustc crashes at the final crate for this target with smaller thread stacks.
          RUST_MIN_STACK: "268435456"
        run: cargo build --release --locked --target "$TARGET" -j4

      - name: Verify static binary
        run: |
          bin="target/$TARGET/release/herdr"
          base="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          revision="$(sed -n 's/^pub const SUPERHERDR_REVISION: u32 = \([0-9][0-9]*\);/\1/p' src/build_info.rs)"
          test -n "$base" && test -n "$revision"
          version="$base.$revision"
          file "$bin"
          # Capture output first so an early-exiting grep cannot hide a match behind SIGPIPE.
          readelf -l "$bin" > program-headers.txt
          readelf -d "$bin" > dynamic-section.txt
          strings "$bin" > strings.txt
          if grep -q INTERP program-headers.txt; then echo "unexpected program interpreter" >&2; exit 1; fi
          if grep -q NEEDED dynamic-section.txt; then echo "unexpected shared library dependency" >&2; exit 1; fi
          if grep -q 'GLIBC_[0-9]' strings.txt; then echo "unexpected glibc symbol version" >&2; exit 1; fi
          test "$("$bin" --version)" = "herdr $base (superherdr $version)"
          "$bin" status client --json | tee status.json
          grep -q '"channel":"stable"' status.json
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Smoke test server and PTY roundtrip
        run: |
          bin="$PWD/target/$TARGET/release/herdr"
          tmp="$(mktemp -d)"
          export XDG_CONFIG_HOME="$tmp/config" XDG_RUNTIME_DIR="$tmp/run"
          mkdir -p "$XDG_CONFIG_HOME/herdr" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          echo 'onboarding = false' > "$XDG_CONFIG_HOME/herdr/config.toml"
          unset HERDR_SOCKET_PATH HERDR_CLIENT_SOCKET_PATH HERDR_ENV
          "$bin" --session smoke server > "$tmp/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          export HERDR_SOCKET_PATH="$XDG_CONFIG_HOME/herdr/sessions/smoke/herdr.sock"
          for _ in $(seq 100); do [ -S "$HERDR_SOCKET_PATH" ] && break; sleep 0.2; done
          test -S "$HERDR_SOCKET_PATH" || { cat "$tmp/server.log"; exit 1; }
          "$bin" workspace create --cwd "$tmp" > "$tmp/created.json"
          pane="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["result"]["root_pane"]["pane_id"])' "$tmp/created.json")"
          "$bin" pane run "$pane" "printf 'SMOKE_%s\\n' OK"
          for _ in $(seq 50); do
            "$bin" pane read "$pane" --source recent > "$tmp/pane.txt" || true
            if grep -q SMOKE_OK "$tmp/pane.txt"; then echo "PTY roundtrip ok"; exit 0; fi
            sleep 0.2
          done
          cat "$tmp/pane.txt" "$tmp/server.log"
          exit 1

      - name: Package
        run: |
          name="superherdr-$VERSION-linux-x86_64"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage/licenses"
          cp "target/$TARGET/release/herdr" "$stage/herdr"
          cp LICENSE "$stage/LICENSE"
          cp vendor/libghostty-vt/LICENSE "$stage/licenses/libghostty-vt-LICENSE"
          cp vendor/portable-pty/LICENSE.md "$stage/licenses/portable-pty-LICENSE.md"
          tar -C "$stage" -czf "$name.tar.gz" herdr LICENSE licenses
          sha256sum "$name.tar.gz" | tee "$name.tar.gz.sha256"
          echo "COMMIT=$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: superherdr-linux-x86_64
          path: |
            superherdr-*-linux-x86_64.tar.gz
            superherdr-*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
