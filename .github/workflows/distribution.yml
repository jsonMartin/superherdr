name: Agent detection catalog

on:
  pull_request:
    paths:
      - ".github/workflows/distribution.yml"
      - "distribution/agent-detection/**"
      - "scripts/agent_detection_manifest_check.py"
      - "scripts/test_agent_detection_manifest_check.py"
      - "src/detect/manifest_update.rs"
      - "src/detect/manifests/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/distribution.yml"
      - "distribution/agent-detection/**"
      - "scripts/agent_detection_manifest_check.py"
      - "scripts/test_agent_detection_manifest_check.py"
      - "src/detect/manifest_update.rs"
      - "src/detect/manifests/**"

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate catalog matches bundled manifests
        run: |
          python3 scripts/agent_detection_manifest_check.py --require-published

      - name: Test contract tooling
        run: |
          python3 -m unittest scripts.test_agent_detection_manifest_check
