name: Bug report
description: Report a reproducible bug in Superherdr.
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/jsonMartin/superherdr/issues?q=is%3Aissue) first. If the bug also happens in [Herdr](https://github.com/herdrdev/herdr) and isn't caused by Superherdr's changes, please report it upstream.

        Keep the report factual and short. For feature ideas, see [CONTRIBUTING.md](https://github.com/jsonMartin/superherdr/blob/main/CONTRIBUTING.md#propose-before-implementing).

  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: What happens now? Describe what you observed.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The shortest exact steps or commands that show the problem.
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation
      options:
        - Homebrew
        - Shell installer
        - Built from source
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Superherdr version is required (`herdr --version`). Include whether the bug also happens in Herdr, if you know.
      value: |
        - Superherdr version:
        - Operating system:
        - Terminal:
        - Also happens in Herdr (yes / no / unknown):
        - Relevant config, if any:
    validations:
      required: true
